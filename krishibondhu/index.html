<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#15803d" />
  <meta name="description" content="KrishiBondhu - Weather-based crop advisory and smart market price comparison for farmers." />
  <title>KrishiBondhu</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- App is rendered inside a phone frame so it looks like a mobile app on desktop too -->
  <div class="device-shell">
    <div class="device" id="device">
      <div class="status-bar" id="statusBar">
        <span class="sb-time" id="sbTime">9:41</span>
        <span class="sb-icons">
          <span class="sb-net" id="sbNet">●</span>
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="currentColor"/><rect x="5" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="10" y="0" width="3" height="12" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity="0.4"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.2" fill="currentColor"/><rect x="21" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
        </span>
      </div>

      <!-- Offline banner -->
      <div class="offline-bar" id="offlineBar" hidden>
        <span id="offlineText">You are offline — showing saved data</span>
      </div>

      <!-- Main screen container -->
      <main id="screen" class="screen"></main>

      <!-- Bottom navigation (hidden on auth screens) -->
      <nav class="tabbar" id="tabbar" hidden></nav>

      <!-- Toast + modal roots -->
      <div class="toast-wrap" id="toastWrap"></div>
      <div class="sheet-root" id="sheetRoot"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
